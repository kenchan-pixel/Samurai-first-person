<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../src/styles.css" />
  <title>Mastery browser integration harness</title>
</head>
<body>
  <main id="app" class="app">
    <section id="start-screen" class="modal modal--visible">
      <div class="modal__content">
        <div class="crest" aria-hidden="true">刃</div>
        <p class="modal__eyebrow">FIRST-PERSON SAMURAI ACTION</p>
        <h1>Blade Reversal<br /><span>刃返</span></h1>
        <p>讀取敵人攻擊方向，在刀刃落下嘅一刻點擊相應位置格擋，再掃屏反擊。</p>
        <button id="start-button" class="primary-button" type="button">拔刀</button>
        <small>建議直向顯示</small>
      </div>
    </section>

    <section id="result-screen" class="modal modal--visible" aria-live="assertive">
      <div id="result-content" class="modal__content modal__content--result">
        <p id="result-eyebrow" class="modal__eyebrow">DUEL COMPLETE</p>
        <h2 id="result-title">勝利</h2>
        <p id="result-summary">等待測試。</p>
        <div class="result-score"><span>得分</span><strong id="result-score">0</strong></div>
        <button id="restart-button" class="primary-button" type="button">重新挑戰</button>
      </div>
    </section>
    <pre id="harness-error" hidden></pre>
  </main>

  <script type="module">
    import '../src/mastery-overlay.js';
    import {
      requestRoninPractice,
      requestShogunPractice,
    } from '../src/practice-mode.js';
    import { CombatEngine, Direction, ENEMIES } from '../src/game-core.js';
    import { BOSS_PHASE_ONE } from '../src/boss-encounter.js';

    const BEST_KEY = 'blade-reversal-mastery-v1';
    const root = document.documentElement;
    const errorNode = document.querySelector('#harness-error');

    const enemy = Object.freeze({
      id: 'mastery-smoke',
      name: 'Mastery Smoke',
      title: 'Smoke Arena',
      maxHp: 1,
      postureMax: 4,
      gapMs: 10,
      recoveryMs: 20,
      perfectWindowMs: 20,
      attacks: Object.freeze([
        Object.freeze({ direction: Direction.TOP, telegraphMs: 10, strikeMs: 100, damage: 1 }),
      ]),
    });

    async function flush() {
      await Promise.resolve();
      await new Promise((resolve) => setTimeout(resolve, 0));
    }

    async function completeVictory({ missFirst = false, lateParry = false } = {}) {
      requestRoninPractice(false);
      const combat = new CombatEngine({ enemies: [enemy] });
      combat.start(0);
      combat.drainEvents();
      combat.update(1550);
      combat.update(1560);
      if (missFirst) {
        combat.attemptParry(Direction.RIGHT, 1561);
        combat.drainEvents();
      }
      const parryAt = lateParry ? 1590 : 1561;
      const parry = combat.attemptParry(Direction.TOP, parryAt);
      if (!parry.accepted) throw new Error(`expected parry acceptance, got ${parry.reason}`);
      const counter = combat.attemptAttack(Direction.BOTTOM, parryAt + 1);
      if (!counter.accepted || !counter.defeated) throw new Error('deterministic counter did not defeat smoke enemy');
      combat.drainEvents();
      combat.update(parryAt + 1452);
      combat.drainEvents();
      await flush();
    }

    const uiCombat = new CombatEngine({ enemies: [...ENEMIES, BOSS_PHASE_ONE] });
    let uiNow = 1000;
    const startButton = document.querySelector('#start-button');
    const restartButton = document.querySelector('#restart-button');

    startButton?.addEventListener('click', () => {
      uiNow += 1000;
      uiCombat.start(uiNow);
    });

    restartButton?.addEventListener('click', () => {
      uiNow += 1000;
      uiCombat.reset(uiNow);
      uiCombat.start(uiNow);
    });

    function expectUiStage({ practice, stage, enemyId }, label) {
      const events = uiCombat.drainEvents();
      const stageStart = events.find((event) => event.type === 'stage-start');
      const ok =
        uiCombat.enemy?.id === enemyId &&
        stageStart?.detail?.stage === stage &&
        Boolean(stageStart?.detail?.practice) === Boolean(practice);
      if (!ok) throw new Error(`${label} did not start expected ${enemyId} stage ${stage}`);
      return stageStart;
    }

    async function finishUiPractice({ enemyId, stage }) {
      uiCombat.enemyHp = 0;
      uiCombat.phase = 'stage-clear';
      uiCombat.phaseStartedAt = uiNow + 10;
      uiCombat.phaseEndsAt = uiNow + 20;
      uiCombat.events.push({
        type: 'enemy-defeated',
        detail: { enemyId, stage },
      });
      uiNow += 20;
      uiCombat.update(uiNow);
      const terminalEvents = uiCombat.drainEvents();
      const victory = terminalEvents.find((event) => event.type === 'victory' && event.detail?.practice);
      if (!victory || victory.detail?.practiceEnemyId !== enemyId || victory.detail?.practiceStage !== stage) {
        throw new Error(`practice UI run did not terminate after ${enemyId} stage ${stage}`);
      }
      await flush();
    }

    async function completeRoninPracticeViaControls(firstBest) {
      const practiceButton = document.querySelector('#practice-ronin-button');
      const campaignButton = document.querySelector('#ronin-practice-campaign');
      if (!practiceButton || !campaignButton || !startButton || !restartButton) {
        throw new Error('Ronin practice player-facing controls were not installed');
      }

      practiceButton.click();
      expectUiStage({ practice: true, stage: 2, enemyId: 'wandering-ronin' }, 'Ronin practice entry click');
      await finishUiPractice({ enemyId: 'wandering-ronin', stage: 2 });

      const practiceAnalysisText = document.querySelector('#result-analysis')?.textContent || '';
      const practiceSummary = document.querySelector('#result-summary')?.textContent || '';
      const practiceEyebrow = document.querySelector('#result-eyebrow')?.textContent || '';
      const firstTerminalUi =
        restartButton.textContent.includes('再練浪人') &&
        campaignButton.hidden === false &&
        root.dataset.runMode === 'ronin-practice';

      restartButton.click();
      expectUiStage({ practice: true, stage: 2, enemyId: 'wandering-ronin' }, 'Ronin practice retry click');
      const retryStarted = root.dataset.runMode === 'ronin-practice' && campaignButton.hidden === true;
      await finishUiPractice({ enemyId: 'wandering-ronin', stage: 2 });

      campaignButton.click();
      expectUiStage({ practice: false, stage: 1, enemyId: 'ashigaru-scout' }, 'Ronin campaign action click');
      const campaignStarted = root.dataset.runMode === 'campaign' && restartButton.textContent === '重新挑戰';

      const resultOk =
        localStorage.getItem(BEST_KEY) === firstBest &&
        practiceEyebrow.includes('RONIN PRACTICE') &&
        practiceSummary.includes('不計個人最佳') &&
        practiceAnalysisText.includes('第2關') &&
        practiceAnalysisText.includes('浪人');

      root.dataset.roninPracticeControls = String(firstTerminalUi && retryStarted && campaignStarted);
      root.dataset.roninPracticeIntegration = String(resultOk && root.dataset.roninPracticeControls === 'true');
    }

    async function completeShogunPracticeViaControls(firstBest) {
      const practiceButton = document.querySelector('#practice-shogun-button');
      const campaignButton = document.querySelector('#ronin-practice-campaign');
      if (!practiceButton || !campaignButton || !startButton || !restartButton) {
        throw new Error('Shogun practice player-facing controls were not installed');
      }

      practiceButton.click();
      expectUiStage({ practice: true, stage: 4, enemyId: 'crimson-shogun' }, 'Shogun practice entry click');
      await finishUiPractice({ enemyId: 'crimson-shogun', stage: 4 });

      const practiceAnalysisText = document.querySelector('#result-analysis')?.textContent || '';
      const practiceSummary = document.querySelector('#result-summary')?.textContent || '';
      const practiceEyebrow = document.querySelector('#result-eyebrow')?.textContent || '';
      const firstTerminalUi =
        restartButton.textContent.includes('再戰將軍') &&
        campaignButton.hidden === false &&
        root.dataset.runMode === 'shogun-practice';

      restartButton.click();
      expectUiStage({ practice: true, stage: 4, enemyId: 'crimson-shogun' }, 'Shogun practice retry click');
      const retryStarted = root.dataset.runMode === 'shogun-practice' && campaignButton.hidden === true;
      await finishUiPractice({ enemyId: 'crimson-shogun', stage: 4 });

      campaignButton.click();
      expectUiStage({ practice: false, stage: 1, enemyId: 'ashigaru-scout' }, 'Shogun campaign action click');
      const campaignStarted = root.dataset.runMode === 'campaign' && restartButton.textContent === '重新挑戰';

      const resultOk =
        localStorage.getItem(BEST_KEY) === firstBest &&
        practiceEyebrow.includes('SHOGUN PRACTICE') &&
        practiceSummary.includes('不計個人最佳') &&
        practiceAnalysisText.includes('第4關') &&
        practiceAnalysisText.includes('赤將軍');

      root.dataset.shogunPracticeControls = String(firstTerminalUi && retryStarted && campaignStarted);
      root.dataset.shogunPracticeIntegration = String(resultOk && root.dataset.shogunPracticeControls === 'true');
    }

    try {
      localStorage.removeItem(BEST_KEY);
      await completeVictory();

      const firstBest = localStorage.getItem(BEST_KEY);
      if (!firstBest) throw new Error('completed victory did not persist a personal best');
      if (!document.querySelector('#result-eyebrow')?.textContent.includes('MASTERY')) {
        throw new Error('mastery overlay did not render after CombatEngine victory events');
      }
      const firstSummary = document.querySelector('#result-summary')?.textContent || '';
      for (const label of ['格擋', '完美', '破防', '受擊']) {
        if (!firstSummary.includes(label)) throw new Error(`result summary missing ${label}`);
      }

      const analysis = document.querySelector('#result-analysis');
      const analysisReady =
        root.dataset.runAnalysisReady === 'true' &&
        root.dataset.runAnalysisRendered === 'true' &&
        Boolean(analysis && !analysis.hidden) &&
        (analysis?.querySelectorAll('.result-analysis__stage').length || 0) >= 1 &&
        Boolean((analysis?.querySelector('[data-analysis-tip]')?.textContent || '').trim());
      root.dataset.runAnalysis = String(analysisReady);

      await completeRoninPracticeViaControls(firstBest);
      await completeShogunPracticeViaControls(firstBest);

      await completeVictory({ missFirst: true, lateParry: true });
      root.dataset.masteryBestPreserved = String(localStorage.getItem(BEST_KEY) === firstBest);

      localStorage.removeItem(BEST_KEY);
      const originalSetItem = Storage.prototype.setItem;
      Storage.prototype.setItem = function blockedSetItem() {
        throw new DOMException('blocked for smoke test', 'SecurityError');
      };
      try {
        await completeVictory();
        root.dataset.masteryStorageFallback = String(
          document.querySelector('#result-eyebrow')?.textContent.includes('MASTERY') &&
          document.querySelector('#result-summary')?.textContent.includes('格擋'),
        );
      } finally {
        Storage.prototype.setItem = originalSetItem;
      }

      const contentRect = document.querySelector('#result-content').getBoundingClientRect();
      const restartRect = document.querySelector('#restart-button').getBoundingClientRect();
      const analysisRect = document.querySelector('#result-analysis')?.getBoundingClientRect();
      const fitsViewport =
        contentRect.top >= 0 &&
        restartRect.bottom <= window.innerHeight &&
        contentRect.width <= window.innerWidth &&
        (!analysisRect || (analysisRect.left >= 0 && analysisRect.right <= window.innerWidth));
      root.dataset.resultLayout = fitsViewport ? 'pass' : 'fail';

      const passed =
        root.dataset.runAnalysis === 'true' &&
        root.dataset.roninPracticeIntegration === 'true' &&
        root.dataset.roninPracticeControls === 'true' &&
        root.dataset.shogunPracticeIntegration === 'true' &&
        root.dataset.shogunPracticeControls === 'true' &&
        root.dataset.masteryBestPreserved === 'true' &&
        root.dataset.masteryStorageFallback === 'true' &&
        root.dataset.resultLayout === 'pass';
      root.dataset.masteryIntegration = passed ? 'pass' : 'fail';
    } catch (error) {
      requestRoninPractice(false);
      requestShogunPractice(false);
      errorNode.hidden = false;
      errorNode.textContent = error?.stack || String(error);
      root.dataset.masteryIntegration = 'fail';
    }
  </script>
</body>
</html>
