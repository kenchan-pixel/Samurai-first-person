<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <style>
    :root{--safe-top:0px;--safe-right:0px;--safe-bottom:0px;--safe-left:0px}
    html,body{margin:0;width:100%;height:100%;background:#090a0d}
    #app{position:relative;width:100vw;height:100vh;overflow:hidden}
    #start-screen{position:absolute;inset:0}
    #start-button{position:absolute;left:50%;top:70%;transform:translateX(-50%)}
  </style>
</head>
<body>
  <main id="app">
    <section id="start-screen"><button id="start-button" type="button">拔刀</button></section>
  </main>
  <script type="module">
    import { CombatEngine, Direction } from '../src/game-core.js';
    import '../src/timing-assist.js';

    const root = document.documentElement;
    const toggle = document.querySelector('#timing-assist-toggle');
    const engine = new CombatEngine();

    toggle?.click();
    const toggleOn = root.dataset.timingAssist === 'on' && toggle?.getAttribute('aria-pressed') === 'true';

    engine.start(0);
    engine.update(1550);
    const earlyScale = Number(root.dataset.timingAssistScale);
    const telegraph = root.dataset.timingAssistPhase === 'telegraph' && root.dataset.timingAssistDirection === Direction.TOP;

    engine.update(2200);
    const lateScale = Number(root.dataset.timingAssistScale);
    const shrinks = Number.isFinite(earlyScale) && Number.isFinite(lateScale) && lateScale < earlyScale && lateScale > 1;

    engine.update(2430);
    const perfectState = root.dataset.timingAssistPhase === 'perfect' && root.dataset.timingAssistDirection === Direction.TOP;

    engine.update(2536);
    const normalState = root.dataset.timingAssistPhase === 'strike' && root.dataset.timingAssistDirection === Direction.TOP;

    const parry = engine.attemptParry(Direction.TOP, 2536);
    engine.update(2536);
    const cleared = parry.accepted === true && root.dataset.timingAssistPhase === 'hidden';

    const layer = document.querySelector('#timing-assist-layer');
    const ring = document.querySelector('#timing-assist-ring');
    const pointerSafe = Boolean(layer && getComputedStyle(layer).pointerEvents === 'none' && ring);
    const toggleRect = toggle?.getBoundingClientRect();
    const layout = Boolean(toggleRect && toggleRect.left >= 0 && toggleRect.top >= 0 && toggleRect.right <= innerWidth && toggleRect.bottom <= innerHeight);

    root.dataset.timingAssistToggle = String(toggleOn);
    root.dataset.timingAssistTelegraph = String(telegraph);
    root.dataset.timingAssistShrink = String(shrinks);
    root.dataset.timingAssistPerfect = String(perfectState);
    root.dataset.timingAssistNormal = String(normalState);
    root.dataset.timingAssistClear = String(cleared);
    root.dataset.timingAssistPointerSafe = String(pointerSafe);
    root.dataset.timingAssistLayout = layout ? 'pass' : 'fail';
    root.dataset.timingAssistIntegration = toggleOn && telegraph && shrinks && perfectState && normalState && cleared && pointerSafe && layout ? 'pass' : 'fail';
  </script>
</body>
</html>
