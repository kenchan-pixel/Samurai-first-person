<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Onboarding browser harness</title>
  <style>
    :root{--safe-top:12px;--safe-right:12px;--safe-bottom:12px;--safe-left:12px}
    html,body{margin:0;width:100%;height:100%;background:#090a0d;color:white;font-family:system-ui,sans-serif}
    #app{position:fixed;inset:0;overflow:hidden}
    .modal{position:absolute;inset:0;display:none}.modal__content{width:280px;margin:auto}.control-demo{display:block}
  </style>
</head>
<body>
  <main id="app">
    <section id="start-screen" class="modal"><div class="modal__content"><div class="control-demo"></div><button id="start-button">Start</button></div></section>
    <section id="result-screen" class="modal"><div class="modal__content modal__content--result"></div></section>
  </main>
  <script type="module">
    const preferenceKey = 'blade-reversal-guided-duel-v1';
    localStorage.removeItem(preferenceKey);
    const { CombatEngine, Direction } = await import('../src/game-core.js');
    await import('../src/onboarding-coach.js');
    await import('../src/footwork.js');
    await import('../src/perfect-riposte.js');

    const initialToggle = document.querySelector('#coach-toggle');
    const initialToggleReady = Boolean(initialToggle && initialToggle.getAttribute('aria-pressed') === 'true');

    const guideButton = document.querySelector('#combat-guide-button');
    const guideSheet = document.querySelector('#combat-guide-sheet');
    const actionCue = document.querySelector('#combat-action-cue');
    guideButton?.click();
    const guideRect = guideSheet?.getBoundingClientRect();
    const guideText = guideSheet?.textContent || '';
    const guideOpen =
      guideButton?.getAttribute('aria-expanded') === 'true' &&
      guideSheet?.hidden === false &&
      guideText.includes('格擋成功只係打開反擊窗口') &&
      guideText.includes('相反方向掃') &&
      guideText.includes('STEP') &&
      guideText.includes('第二關 · Ronin');
    const guideInsideViewport = Boolean(
      guideRect &&
      guideRect.left >= 0 &&
      guideRect.top >= 0 &&
      guideRect.right <= innerWidth &&
      guideRect.bottom <= innerHeight &&
      getComputedStyle(guideSheet).overflowY === 'auto'
    );
    guideSheet?.querySelector('.combat-guide__close')?.click();
    const guideClose = guideSheet?.hidden === true && guideButton?.getAttribute('aria-expanded') === 'false';

    const evadeEnemy = {
      id: 'ashigaru-scout',
      name: 'Evade Ashigaru',
      title: 'Harness',
      maxHp: 2,
      postureMax: 3,
      gapMs: 100,
      recoveryMs: 300,
      perfectWindowMs: 45,
      attacks: [{ direction: Direction.TOP, telegraphMs: 100, strikeMs: 120, damage: 1 }],
    };

    const evadeEngine = new CombatEngine({ enemies: [evadeEnemy] });
    evadeEngine.start(0);
    evadeEngine.drainEvents();
    evadeEngine.update(1550);
    evadeEngine.drainEvents();
    evadeEngine.update(1650);
    evadeEngine.drainEvents();
    const evade = evadeEngine.attemptBackstep(1660);
    evadeEngine.drainEvents();
    const evadeCounter = evadeEngine.attemptAttack(Direction.BOTTOM, 1670);
    evadeEngine.drainEvents();

    const noPrematureCompletion =
      evade.accepted === true &&
      evadeCounter.accepted === true &&
      evadeCounter.defeated === true &&
      localStorage.getItem(preferenceKey) !== 'completed' &&
      initialToggle?.getAttribute('aria-pressed') === 'true';

    const freshEngine = new CombatEngine({ enemies: [evadeEnemy] });
    freshEngine.start(0);
    freshEngine.drainEvents();
    const freshPanel = document.querySelector('#onboarding-coach');
    const guidanceReturns =
      freshPanel?.dataset.mode === 'basics' &&
      freshPanel?.dataset.completed === 'false' &&
      initialToggle?.getAttribute('aria-pressed') === 'true';

    const engine = new CombatEngine();
    engine.start(0);
    engine.drainEvents();

    engine.update(1550);
    engine.drainEvents();
    engine.update(2430);
    engine.drainEvents();

    engine.attemptParry(Direction.LEFT, 2430);
    engine.drainEvents();
    const missHint = document.querySelector('.coach__hint')?.textContent || '';

    engine.attemptParry(Direction.TOP, 2431);
    engine.drainEvents();
    engine.attemptAttack(Direction.BOTTOM, 2440);
    engine.drainEvents();

    const panel = document.querySelector('#onboarding-coach');
    const toggle = document.querySelector('#coach-toggle');
    const rect = panel?.getBoundingClientRect();
    const insideViewport = Boolean(rect && rect.left >= 0 && rect.top >= 0 && rect.right <= innerWidth && rect.bottom <= innerHeight);
    const pointerTransparent = panel ? getComputedStyle(panel).pointerEvents === 'none' : false;

    const stepsPassed = panel?.dataset.coachStepRead === 'done' && panel?.dataset.coachStepParry === 'done' && panel?.dataset.coachStepCounter === 'done';
    const completed = panel?.dataset.completed === 'true';
    const adaptiveMiss = missHint.includes('方向錯誤');
    const completionStored = localStorage.getItem(preferenceKey) === 'completed';
    const completionDefaultsOff = Boolean(toggle && toggle.getAttribute('aria-pressed') === 'false');
    const toggleLifecyclePassed = initialToggleReady && completionStored && completionDefaultsOff;

    const rampEnemy1 = {
      id: 'ashigaru-scout',
      name: 'Ramp Ashigaru',
      title: 'Harness 1',
      maxHp: 1,
      postureMax: 3,
      gapMs: 100,
      recoveryMs: 240,
      perfectWindowMs: 30,
      attacks: [{ direction: Direction.TOP, telegraphMs: 100, strikeMs: 120, damage: 1 }],
    };
    const rampEnemy2 = {
      id: 'wandering-ronin',
      name: 'Ramp Ronin',
      title: 'Harness 2',
      maxHp: 3,
      postureMax: 4,
      gapMs: 100,
      recoveryMs: 240,
      perfectWindowMs: 50,
      attacks: [{ direction: Direction.RIGHT, telegraphMs: 100, strikeMs: 120, damage: 1 }],
    };
    const rampEngine = new CombatEngine({ enemies: [rampEnemy1, rampEnemy2] });
    rampEngine.start(0);
    rampEngine.drainEvents();
    rampEngine.update(1550);
    rampEngine.drainEvents();
    rampEngine.update(1650);
    rampEngine.drainEvents();
    const rampParry = rampEngine.attemptParry(Direction.TOP, 1690);
    rampEngine.drainEvents();
    const rampCounter = rampEngine.attemptAttack(Direction.BOTTOM, 1700);
    rampEngine.drainEvents();
    rampEngine.update(3150);
    rampEngine.drainEvents();
    const roninCue =
      rampParry.accepted === true &&
      rampCounter.accepted === true &&
      actionCue?.querySelector('strong')?.textContent.includes('RONIN') &&
      actionCue?.querySelector('span')?.textContent.includes('最後刀路');

    rampEngine.update(4700);
    rampEngine.drainEvents();
    rampEngine.update(4800);
    rampEngine.drainEvents();
    const perfect = rampEngine.attemptParry(Direction.RIGHT, 4801);
    rampEngine.drainEvents();
    const riposteCue =
      perfect.accepted === true &&
      perfect.perfect === true &&
      perfect.autoRiposte === true &&
      actionCue?.querySelector('strong')?.textContent.includes('自動補刀') &&
      actionCue?.querySelector('span')?.textContent.includes('再掃');

    const cueTitle = actionCue?.querySelector('strong');
    const cueReadable =
      actionCue &&
      cueTitle &&
      getComputedStyle(actionCue).pointerEvents === 'none' &&
      parseFloat(getComputedStyle(cueTitle).fontSize) >= 14;

    const gameplayGuidePassed = guideOpen && guideClose && roninCue && riposteCue;
    document.documentElement.dataset.onboardingIntegration = stepsPassed && completed && adaptiveMiss && gameplayGuidePassed ? 'pass' : 'fail';
    document.documentElement.dataset.onboardingLayout = insideViewport && pointerTransparent && guideInsideViewport && cueReadable ? 'pass' : 'fail';
    document.documentElement.dataset.onboardingToggle = toggleLifecyclePassed ? 'true' : 'false';
    document.documentElement.dataset.onboardingSkipParry = noPrematureCompletion && guidanceReturns ? 'true' : 'false';
    document.documentElement.dataset.gameplayGuideUi = guideOpen && guideClose ? 'true' : 'false';
    document.documentElement.dataset.gameplayGuideRonin = roninCue ? 'true' : 'false';
    document.documentElement.dataset.gameplayGuideRiposte = riposteCue ? 'true' : 'false';
  </script>
</body>
</html>
